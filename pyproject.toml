[project]
name = "ig2tg-bot"
version = "1.0.0"
description = "سامانه ربات دریافت محتوای اینستاگرام و ارسال به تلگرام با سیستم اشتراک، فروش دستی و پنل مدیریت"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.13,<4",
    "instagrapi>=3.0",
    "yt-dlp>=2026.10.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = false

[tool.setuptools.packages.find]
include = ["app*"]
